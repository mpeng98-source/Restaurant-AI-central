name: Bootstrap runtime permission diagnostic (GET only)

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Reviewed full main commit SHA (diagnostic only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chubby-protected-coding-agent
  cancel-in-progress: false

jobs:
  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: dev-agent-bootstrap-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write # Match Bootstrap identity; diagnostic transport permits GET only.
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Read security metadata with the actual job token
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python scripts/dev_agent_bootstrap_runtime_diagnostic.py
