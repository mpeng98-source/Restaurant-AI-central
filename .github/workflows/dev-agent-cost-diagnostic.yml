name: Dev Agent cost diagnostic (read-only, manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: cost-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Diagnose current UTC-day project cost collection
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          PROJECT_ID: ${{ vars.CHUBBY_DEV_AGENT_PROJECT_ID }}
        run: >-
          python scripts/dev_agent_accounting_cli.py diagnose-costs --project-id "$PROJECT_ID"
          --producer-workflow .github/workflows/dev-agent-cost-diagnostic.yml
