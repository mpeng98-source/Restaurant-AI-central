name: Authenticated cost ingestion (inactive, manual only)

on:
  workflow_dispatch:
    inputs:
      utc_day:
        description: "Optional YYYY-MM-DD for reviewed historical settlement (last 7 days)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: authenticated-cost-ingestion
  cancel-in-progress: false

jobs:
  collect:
    # No activation variable is created or changed by this PR.
    if: ${{ github.ref == 'refs/heads/main' && vars.DEV_AGENT_ACCOUNTING_V26_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cost-audit-v26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Collect directly from OpenAI and sign in protected boundary
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          DEV_AGENT_COST_SIGNING_KEY: ${{ secrets.DEV_AGENT_COST_SIGNING_KEY }}
          PROJECT_ID: ${{ vars.CHUBBY_DEV_AGENT_PROJECT_ID }}
          UTC_DAY: ${{ inputs.utc_day }}
        run: python scripts/dev_agent_accounting_cli.py collect --project-id "$PROJECT_ID" --utc-day "$UTC_DAY" --output cost-envelope.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: cost-envelope.json
          if-no-files-found: error
          retention-days: 1
  ingest:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cost-writer-v26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg==3.2.6 psycopg-binary==3.2.6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected-input
      - name: Verify expected producer and ingest; never trust artifact self-identity
        env:
          DEV_AGENT_COST_SIGNING_KEY: ${{ secrets.DEV_AGENT_COST_SIGNING_KEY }}
          DEV_AGENT_COST_WRITER_DATABASE_URL: ${{ secrets.DEV_AGENT_COST_WRITER_DATABASE_URL }}
          PROJECT_ID: ${{ vars.CHUBBY_DEV_AGENT_PROJECT_ID }}
        run: >-
          python scripts/dev_agent_accounting_cli.py ingest
          --project-id "$PROJECT_ID" --input protected-input/cost-envelope.json
          --producer-run "${{ github.run_id }}" --producer-attempt "${{ github.run_attempt }}"
          --producer-sha "${{ github.sha }}" --output cost-receipt.json
