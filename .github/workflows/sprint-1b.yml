name: Sprint 1B security and runtime verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-1b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-agent-v2-security:
    name: Dev Agent v2 security regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Dev Agent v2 change-gate security tests
        run: python -m unittest discover -s scripts -p 'test_dev_agent_v2_gate.py' -v

      - name: Run Dev Agent v2.1 queue tests
        run: python -m unittest discover -s scripts -p 'test_dev_agent_queue.py' -v

      - name: Run Dev Agent v2.1 snapshot tests
        run: python -m unittest discover -s scripts -p 'test_dev_agent_snapshot.py' -v

      - name: Test queue-to-Codex task preparation
        run: python -m unittest discover -s scripts -p 'test_dev_agent_prepare_task.py' -v

      - name: Test Dev Agent v2.2 reliability
        run: python -m unittest discover -s scripts -p 'test_dev_agent_reliability.py' -v

      - name: Test signed permit binding and expiry
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_signed_evidence.py' -v
          python -m py_compile scripts/dev_agent_signed_evidence.py scripts/dev_agent_permit_ledger.py scripts/test_dev_agent_signed_evidence.py

      - name: Test transaction-locked settlement preflight
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_locked_settlement.py' -v
          python -m py_compile scripts/dev_agent_locked_settlement.py scripts/test_dev_agent_locked_settlement.py

      - name: Test UTC-day cost sync and settlement accounting
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_settlement_policy.py' -v
          python -m py_compile scripts/dev_agent_utc_costs.py scripts/dev_agent_settlement_policy.py scripts/test_dev_agent_settlement_policy.py

      - name: Test Dev Agent CI and cost collectors
        run: python -m unittest discover -s scripts -p 'test_dev_agent_collectors.py' -v

      - name: Test Dev Agent v2.4 cost and quota controls
        run: python -m unittest discover -s scripts -p 'test_dev_agent_cost_controls.py' -v

      - name: Test fail-closed Dev Agent control-plane preflight
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_preflight.py' -v
          python -m py_compile scripts/dev_agent_preflight.py scripts/test_dev_agent_preflight.py

      - name: Test Neon rollback-only audit fail-closed behavior
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_neon_write_audit.py' -v
          python -m py_compile scripts/dev_agent_neon_write_audit.py scripts/test_dev_agent_neon_write_audit.py

      - name: Test read-only Neon control-plane verification
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_neon_verify.py' -v
          python -m py_compile scripts/dev_agent_neon_verify.py scripts/test_dev_agent_neon_verify.py

      - name: Test Dev Agent durable reservation and alert outbox
        run: python -m unittest discover -s scripts -p 'test_dev_agent_durable_controls.py' -v

      - name: Compile durable controls
        run: python -m py_compile scripts/dev_agent_durable_controls.py scripts/test_dev_agent_durable_controls.py

      - name: Compile Dev Agent v2.4 cost controls
        run: python -m py_compile scripts/dev_agent_cost_controls.py scripts/test_dev_agent_cost_controls.py

      - name: Compile Dev Agent CI and cost collectors
        run: python -m py_compile scripts/dev_agent_ci_collector.py scripts/dev_agent_openai_costs.py scripts/test_dev_agent_collectors.py

      - name: Compile Dev Agent v2.2 reliability scripts
        run: python -m py_compile scripts/dev_agent_reliability.py scripts/test_dev_agent_reliability.py

      - name: Compile queue-to-Codex task preparation
        run: python -m py_compile scripts/dev_agent_prepare_task.py scripts/test_dev_agent_prepare_task.py

      - name: Compile Dev Agent snapshot scripts
        run: python -m py_compile scripts/dev_agent_snapshot.py scripts/test_dev_agent_snapshot.py

      - name: Compile Dev Agent v2.1 queue scripts
        run: python -m py_compile scripts/dev_agent_queue.py scripts/test_dev_agent_queue.py

      - name: Compile Dev Agent v2 scripts
        run: python -m py_compile scripts/dev_agent_v2_gate.py scripts/test_dev_agent_v2_gate.py

  verify:
    name: Backend, PostgreSQL security, and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chubby
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chubby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chubby_app@localhost:5432/chubby
      MIGRATION_DATABASE_URL: postgresql+psycopg://chubby_migrator@localhost:5432/chubby
      TEST_DATABASE_URL: postgresql+psycopg://chubby_app@localhost:5432/chubby
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://chubby_migrator@localhost:5432/chubby
      TEST_FIXTURE_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/chubby
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      COOKIE_SECURE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock

      - name: Real PostgreSQL Dev Agent quota concurrency tests
        env:
          DEV_AGENT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/chubby
        run: |
          PYTHONPATH=scripts python -m unittest -v scripts/test_dev_agent_postgres_integration.py

      - name: End-to-end Dev Agent preflight on ephemeral PostgreSQL
        env:
          DEV_AGENT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/chubby
        run: |
          PYTHONPATH=scripts python -m unittest -v scripts/test_dev_agent_preflight_postgres.py

      - name: Install pnpm and frontend dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile

      - name: Generate ephemeral test signing secret
        run: echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Provision restricted application database role
        run: |
          psql "postgresql://postgres@localhost:5432/chubby" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE chubby_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE chubby_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE chubby TO chubby_migrator, chubby_app;
          ALTER SCHEMA public OWNER TO chubby_migrator;
          GRANT USAGE ON SCHEMA public TO chubby_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE chubby_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO chubby_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE chubby_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO chubby_app;
          SQL

      - name: Verify mandatory PostgreSQL and Redis configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$TEST_DATABASE_URL"
          test -n "$TEST_MIGRATION_DATABASE_URL"
          test -n "$TEST_FIXTURE_DATABASE_URL"
          test -n "$REDIS_URL"
          python - <<'PY'
          import os
          from redis import Redis
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_FIXTURE_DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
          engine.dispose()
          assert Redis.from_url(os.environ["REDIS_URL"], socket_connect_timeout=3).ping()
          print("PostgreSQL and Redis services are reachable")
          PY

      - name: Run Alembic migrations as migration owner
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migration revision
        working-directory: backend
        run: python -m alembic current

      - name: Run backend, authentication, authorization, and PostgreSQL RLS tests
        working-directory: backend
        run: |
          mkdir -p ../test-results
          python -m pytest -c pyproject.toml -v -ra --junitxml=../test-results/backend.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("../test-results/backend.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          print("Backend test report:", totals)
          if totals["skipped"]:
              raise SystemExit(f"Required backend/PostgreSQL suite skipped {totals['skipped']} tests")
          PY

      - name: Run TypeScript checks
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend for production
        working-directory: frontend
        run: pnpm run build

      - name: Verify Docker Compose configuration
        run: |
          export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export APP_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export MIGRATION_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose config --quiet

  compose-runtime:
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Configure ephemeral local test secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "APP_DATABASE_PASSWORD=$(openssl rand -hex 32)"
            echo "MIGRATION_DATABASE_PASSWORD=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ENVIRONMENT=development"
          } > .env

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Start complete stack and wait for health
        run: |
          if ! docker compose up --build --detach; then
            docker compose logs --no-color db migrate
            exit 1
          fi

      - name: Verify migration, database, Redis, API, frontend, and worker
        run: |
          docker compose logs migrate
          migration_container="$(docker compose ps --all -q migrate)"
          test -n "$migration_container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_container")" = 0
          docker compose exec --no-TTY db pg_isready -U postgres -d chubby
          docker compose exec --no-TTY db psql -U postgres -d chubby -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version"
          docker compose exec --no-TTY redis redis-cli ping
          for service in db redis api worker web; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            for attempt in $(seq 1 30); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
              [ "$health" = healthy ] && break
              [ "$health" = unhealthy ] && { docker compose logs "$service"; exit 1; }
              sleep 2
            done
            test "$health" = healthy
            echo "$service healthcheck: $health"
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          curl --fail http://localhost:3000/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/api/v1/me)" = 401

      - name: Verify frontend login, workspace, and inventory routes
        run: node frontend/tests/smoke.mjs

      - name: Verify graceful shutdown
        if: always()
        run: docker compose down --volumes --timeout 30

  secret-audit:
    name: Full repository and Git-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Reject committed environment files in repository history
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess

          paths = subprocess.check_output(
              ["git", "log", "--all", "--format=", "--name-only"],
              text=True,
          ).splitlines()
          offenders = sorted({
              path for path in paths
              if path and PurePosixPath(path).name.startswith(".env")
              and PurePosixPath(path).name != ".env.example"
          })
          if offenders:
              print("Committed environment files found:", *offenders, sep="\n- ")
              raise SystemExit(1)
          print("No committed .env files found; .env.example is allowed")
          PY

      - name: Scan current repository files with Gitleaks
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/path
          -v "$GITHUB_WORKSPACE:/path:ro"
          -w /path
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          dir --redact .

      - name: Scan all reachable Git history with Gitleaks
        run: >-
          docker run --rm --network none
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/path
          -v "$GITHUB_WORKSPACE:/path:ro"
          -w /path
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --log-opts="--no-textconv --full-history --all --diff-filter=tuxdb" --redact
