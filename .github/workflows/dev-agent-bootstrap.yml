name: Dev Agent one-time billing bootstrap (manual approval)

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Reviewed full main SHA; must equal the dispatched commit"
        required: true
        type: string
      confirmation:
        description: "Type exactly: ONE PROBE; USD 0.01 ESTIMATE; NO RETRY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chubby-protected-coding-agent
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.CHUBBY_DEV_AGENT_BOOTSTRAP_ENABLED == 'true' && vars.CHUBBY_DEV_AGENT_GATED_ENABLED == 'false' }}
    environment: dev-agent-bootstrap-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write # Trusted fixed script atomically creates one permanent tag.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Consume permanent claim then send one fixed probe; no retries
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.CHUBBY_BOOTSTRAP_OPENAI_API_KEY }}
          PROJECT_ID: ${{ vars.CHUBBY_DEV_AGENT_PROJECT_ID }}
          BOOTSTRAP_ENABLED: ${{ vars.CHUBBY_DEV_AGENT_BOOTSTRAP_ENABLED }}
          CODING_ENABLED: ${{ vars.CHUBBY_DEV_AGENT_GATED_ENABLED }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/dev_agent_bootstrap.py
