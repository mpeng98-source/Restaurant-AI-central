name: Chubby Dev Agent Neon write audit (manual, rollback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev-agent-control
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned database driver
        run: python -m pip install psycopg==3.2.6 psycopg-binary==3.2.6
      - name: Test live Neon write and denial paths (rollback only)
        env:
          DEV_AGENT_CONTROL_DATABASE_URL: ${{ secrets.DEV_AGENT_CONTROL_DATABASE_URL }}
        run: PYTHONPATH=scripts python scripts/dev_agent_neon_write_audit.py
