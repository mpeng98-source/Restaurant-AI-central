name: Chubby Dev Agent v2.1 (approved queue to draft PR)

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved GitHub issue number (0 = oldest approved issue)"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: chubby-dev-agent-v2
  cancel-in-progress: false

jobs:
  develop:
    # SECURITY HOLD: do not allow manual dispatch (or schedule) to reach Codex
    # until trusted reservation, signed permit and atomic consumption are
    # wired into this exact workflow as mandatory dependencies.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main without stored GitHub credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Test gate and queue selector
        run: |
          python -m unittest discover -s scripts -p 'test_dev_agent_v2_gate.py' -v
          python -m unittest discover -s scripts -p 'test_dev_agent_queue.py' -v
          python -m unittest discover -s scripts -p 'test_dev_agent_snapshot.py' -v
          python -m unittest discover -s scripts -p 'test_dev_agent_prepare_task.py' -v

      - name: Require API key
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Configure OPENAI_API_KEY Actions secret."
            exit 1
          fi

      - name: Read complete GitHub issue and PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dev_agent_snapshot.py --repo "$GH_REPO" --output /tmp/dev-agent-snapshot.json

      - name: Select explicitly approved safe task
        id: task
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number"
            exit 1
          fi
          python scripts/dev_agent_prepare_task.py /tmp/dev-agent-snapshot.json \
            --issue "$REQUESTED" --result /tmp/dev-agent-selection.json --task agent-task.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("/tmp/dev-agent-selection.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("selected=" + str(result["selected"]).lower() + "\n")
              if result["selected"]:
                  number = result["number"]
                  output.write(f"number={number}\n")
                  output.write(f"branch=agent/issue-{number}-run-{os.environ['GITHUB_RUN_ID']}\n")
          print(json.dumps(result))
          PY

      - name: Create isolated working branch
        if: steps.task.outputs.selected == 'true'
        run: git switch -c "${{ steps.task.outputs.branch }}"

      - name: Run bounded Codex implementation
        # Defense in depth: explicit non-executable gate even if the job-level
        # condition is later refactored; requires a reviewed trusted verifier.
        if: ${{ false }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # pinned v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/codex/prompts/dev-agent-v2.md
          output-file: dev-agent-report.md

      - name: Validate scope and capture patch
        if: steps.task.outputs.selected == 'true'
        id: gate
        shell: bash
        run: |
          set +e
          python scripts/dev_agent_v2_gate.py
          result=$?
          if [ "$result" -eq 3 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push isolated branch
        if: steps.gate.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHUBBY_DEV_AGENT_PR_TOKEN }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE: ${{ steps.task.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure scoped CHUBBY_DEV_AGENT_PR_TOKEN (GitHub App token or fine-grained PAT) to trigger normal PR CI."
            exit 1
          fi
          git config user.name "chubby-dev-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: bounded improvement for issue #$ISSUE"
          # Credential used only in this post-Codex step, not in the model step.
          # Keep credentials out of git's command-line arguments.
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$BRANCH"

      - name: Create draft PR for human review
        if: steps.gate.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHUBBY_DEV_AGENT_PR_TOKEN }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE: ${{ steps.task.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create --repo "$GH_REPO" --draft --base main --head "$BRANCH" \
            --title "Agent proposal: issue #$ISSUE" \
            --body "Automated bounded Codex proposal for issue #$ISSUE. **Unreviewed**: requires CI, security review and explicit owner approval before merge. No deployment performed. This run does not close the issue."

      - name: Upload report and patch
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chubby-dev-agent-v2-${{ github.run_id }}
          path: |
            dev-agent-report.md
            dev-agent.patch
          if-no-files-found: ignore
          retention-days: 7
